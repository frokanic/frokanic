<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="6" viewBox="0 0 1200 6" preserveAspectRatio="none" role="img" aria-label="section divider">
  <defs>
    <linearGradient id="df-g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7F52FF"/>
      <stop offset="0.25" stop-color="#4285F4"/>
      <stop offset="0.5" stop-color="#3DDC84"/>
      <stop offset="0.75" stop-color="#4285F4"/>
      <stop offset="1" stop-color="#7F52FF"/>
    </linearGradient>
  </defs>
  <style>
    .df-run { animation: df-slide 9s linear infinite; }
    @keyframes df-slide { from { transform: translateX(0); } to { transform: translateX(-1200px); } }
    @media (prefers-reduced-motion: reduce) { .df-run { animation: none; } }
  </style>
  <g class="df-run">
    <rect width="1200" height="6" rx="3" fill="url(#df-g)"/>
    <rect x="1200" width="1200" height="6" rx="3" fill="url(#df-g)"/>
  </g>
</svg>
