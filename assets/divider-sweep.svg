<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="6" viewBox="0 0 1200 6" preserveAspectRatio="none" role="img" aria-label="section divider">
  <defs>
    <linearGradient id="sw-base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7F52FF"/>
      <stop offset="1" stop-color="#3DDC84"/>
    </linearGradient>
    <linearGradient id="sw-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .sw-sheen { animation: sw-move 3.6s linear infinite; }
    @keyframes sw-move { from { transform: translateX(-280px); } to { transform: translateX(1200px); } }
    @media (prefers-reduced-motion: reduce) { .sw-sheen { animation: none; opacity: 0; } }
  </style>
  <rect width="1200" height="6" rx="3" fill="url(#sw-base)"/>
  <rect class="sw-sheen" width="280" height="6" rx="3" fill="url(#sw-sheen)"/>
</svg>
