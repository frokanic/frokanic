<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="6" viewBox="0 0 1200 6" preserveAspectRatio="none" role="img" aria-label="section divider">
  <defs>
    <linearGradient id="ps-g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7F52FF"/>
      <stop offset="1" stop-color="#3DDC84"/>
    </linearGradient>
  </defs>
  <style>
    .ps-beat { transform-origin: 600px 3px; animation: ps-grow 3.4s ease-out infinite; }
    @keyframes ps-grow {
      0%   { transform: scaleX(0); opacity: 1; }
      70%  { transform: scaleX(1); opacity: 0; }
      100% { transform: scaleX(1); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) { .ps-beat { animation: none; opacity: 1; } }
  </style>
  <rect width="1200" height="6" rx="3" fill="url(#ps-g)" opacity="0.32"/>
  <rect class="ps-beat" width="1200" height="6" rx="3" fill="url(#ps-g)"/>
</svg>
